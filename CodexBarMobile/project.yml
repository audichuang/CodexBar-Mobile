name: CodexBarMobile
options:
  bundleIdPrefix: com.audichuang.codexbar
  deploymentTarget:
    iOS: "17.0"
  xcodeVersion: "26.0"
  generateEmptyDirectories: true

settings:
  base:
    SWIFT_VERSION: "6.0"
    ENABLE_UPCOMING_FEATURE_STRICT_CONCURRENCY: true

schemes:
  CodexBarMobile:
    build:
      targets:
        CodexBarMobile: all
    test:
      targets:
        - name: CodexBarMobileTests
        - name: CodexBarMobileUITests

  CodexBarMobileLiveQA:
    build:
      targets:
        CodexBarMobile: all
    test:
      config: Release
      targets:
        - name: CodexBarMobileUITests
          selectedTests:
            - LiveQuotaPerformanceUITests/testLiveQuotaInteractions

targets:
  CodexBarSync:
    type: framework
    platform: iOS
    sources:
      - path: ../Shared
        group: Shared
        excludes:
          - "**/.DS_Store"
    configFiles:
      Debug: Config/Fork.xcconfig
      Release: Config/Fork.xcconfig
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(FORK_BUNDLE_PREFIX).sync
        GENERATE_INFOPLIST_FILE: true
        MARKETING_VERSION: "3.3.0"
        CURRENT_PROJECT_VERSION: "261"

  CodexBarMobilePushExtension:
    type: app-extension
    platform: iOS
    sources:
      - path: CodexBarMobilePushExtension
        excludes:
          - "**/.DS_Store"
      # iOS 1.6.0 — NSE looks up Push.QuotaWarning.* strings via
      # String(localized:), which resolves against the extension's
      # OWN bundle (not the host app). Include the main app's xcstrings
      # so the extension ships with the same translations. Same source
      # of truth — Xcode compiles a copy into each bundle.
      - path: CodexBarMobile/Localizable.xcstrings
    dependencies:
      - target: CodexBarSync
    configFiles:
      Debug: Config/Fork.xcconfig
      Release: Config/Fork.xcconfig
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(FORK_BUNDLE_PREFIX).mobile.pushextension
        MARKETING_VERSION: "3.3.0"
        CURRENT_PROJECT_VERSION: "261"
        DEVELOPMENT_TEAM: $(FORK_TEAM)
        INFOPLIST_FILE: CodexBarMobilePushExtension/Info.plist
        CODE_SIGN_ENTITLEMENTS: CodexBarMobilePushExtension/PushExtension.entitlements
        SKIP_INSTALL: true

  CodexBarMobileWidgets:
    type: app-extension
    platform: iOS
    sources:
      - path: CodexBarMobileWidgets
        excludes:
          - "**/.DS_Store"
      - path: CodexBarWidgetShared
        excludes:
          - "**/.DS_Store"
      - path: CodexBarMobile/Models/ProviderColorPalette.swift
      # AppIntent display names and WidgetKit UI strings resolve in the
      # extension bundle, so compile the main localization catalog into
      # the widget target as its source of truth.
      - path: CodexBarMobile/Localizable.xcstrings
    dependencies:
      - target: CodexBarSync
    configFiles:
      Debug: Config/Fork.xcconfig
      Release: Config/Fork.xcconfig
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(FORK_BUNDLE_PREFIX).mobile.widgets
        MARKETING_VERSION: "3.3.0"
        CURRENT_PROJECT_VERSION: "261"
        DEVELOPMENT_TEAM: $(FORK_TEAM)
        INFOPLIST_FILE: CodexBarMobileWidgets/Info.plist
        CODE_SIGN_ENTITLEMENTS: CodexBarMobileWidgets/WidgetExtension.entitlements
        APPLICATION_EXTENSION_API_ONLY: true
        SKIP_INSTALL: true

  CodexBarMobileWidgetOptions:
    type: app-extension
    platform: iOS
    sources:
      - path: CodexBarMobileWidgetOptions
      - path: CodexBarWidgetShared/WidgetProviderCatalogue.swift
      - path: CodexBarWidgetShared
        excludes:
          - "**/*.swift"
          - "**/.DS_Store"
    dependencies:
      - target: CodexBarSync
    configFiles:
      Debug: Config/Fork.xcconfig
      Release: Config/Fork.xcconfig
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(FORK_BUNDLE_PREFIX).mobile.widgetoptions
        MARKETING_VERSION: "3.3.0"
        CURRENT_PROJECT_VERSION: "261"
        DEVELOPMENT_TEAM: $(FORK_TEAM)
        INFOPLIST_FILE: CodexBarMobileWidgetOptions/Info.plist
        CODE_SIGN_ENTITLEMENTS: CodexBarMobileWidgetOptions/WidgetOptions.entitlements
        APPLICATION_EXTENSION_API_ONLY: true
        SKIP_INSTALL: true

  CodexBarMobile:
    type: application
    platform: iOS
    sources:
      - path: CodexBarMobile
        excludes:
          - "**/.DS_Store"
      - path: CodexBarWidgetShared
        excludes:
          - "**/.DS_Store"
    dependencies:
      - target: CodexBarSync
      - target: CodexBarMobilePushExtension
      - target: CodexBarMobileWidgets
      - target: CodexBarMobileWidgetOptions
    configFiles:
      Debug: Config/Fork.xcconfig
      Release: Config/Fork.xcconfig
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(FORK_BUNDLE_PREFIX).mobile
        MARKETING_VERSION: "3.3.0"
        CURRENT_PROJECT_VERSION: "261"
        DEVELOPMENT_TEAM: $(FORK_TEAM)
        INFOPLIST_FILE: CodexBarMobile/Info.plist
        CODE_SIGN_ENTITLEMENTS: CodexBarMobile/CodexBarMobile.entitlements
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        SWIFT_EMIT_LOC_STRINGS: true

  CodexBarMobileTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: CodexBarMobileTests
        excludes:
          - "**/.DS_Store"
    dependencies:
      - target: CodexBarMobile
      - target: CodexBarSync
    configFiles:
      Debug: Config/Fork.xcconfig
      Release: Config/Fork.xcconfig
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(FORK_BUNDLE_PREFIX).mobile.tests
        GENERATE_INFOPLIST_FILE: true

  CodexBarMobileUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - path: CodexBarMobileUITests
        excludes:
          - "**/.DS_Store"
    dependencies:
      - target: CodexBarMobile
    configFiles:
      Debug: Config/Fork.xcconfig
      Release: Config/Fork.xcconfig
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(FORK_BUNDLE_PREFIX).mobile.uitests
        GENERATE_INFOPLIST_FILE: true
        TEST_TARGET_NAME: CodexBarMobile

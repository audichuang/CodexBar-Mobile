<div id="summary-clarity" class="viz-dotted-background" aria-label="摘要卡片交互预览">
  <div class="sc-appearance" aria-label="预览外观"><span>外观</span><button type="button" data-theme="auto">系统</button><button type="button" data-theme="light">浅色</button><button type="button" data-theme="dark">深色</button></div>
  <div class="sc-phone" data-appearance="auto" aria-label="CodexBar 摘要">
    <div class="sc-status"><span>9:41</span><span>▰ ▰ ▰</span></div>
    <header><h2>摘要</h2><div><button type="button" data-edit>编辑</button><button type="button" data-add aria-label="添加指标"><i data-lucide="plus"></i></button></div></header>
    <div class="sc-providers" aria-label="服务商筛选"></div>
    <main><div class="sc-count" aria-live="polite"></div><div class="sc-grid"></div></main>
    <nav aria-label="App 标签页"><span><i data-lucide="chart-no-axes-column-increasing"></i>用量</span><span aria-current="page"><i data-lucide="layout-grid"></i>摘要</span><span><i data-lucide="circle-dollar-sign"></i>费用</span><span><i data-lucide="settings"></i>设置</span></nav>
    <div class="sc-home"></div>
    <div class="sc-overlay" hidden><section class="sc-sheet" role="dialog" aria-modal="true" aria-label="卡片详情"></section></div>
  </div>
</div>
<style>
#summary-clarity{padding:16px 6px 22px;}
#summary-clarity *{box-sizing:border-box;}
#summary-clarity .sc-appearance{display:flex;justify-content:center;align-items:center;gap:6px;margin:0 auto 14px;font:12px -apple-system,BlinkMacSystemFont,sans-serif;color:light-dark(#65656d,#b9b9c0);}
#summary-clarity .sc-appearance button{font:inherit;border:0;border-radius:9px;padding:8px 12px;color:inherit;background:light-dark(#ececf0,#303037);}
#summary-clarity .sc-appearance button[aria-pressed=true]{color:light-dark(#111114,#fff);background:light-dark(#dddde5,#484851);}
#summary-clarity .sc-phone{--sc-bg:light-dark(#f2f2f7,#000);--sc-surface:light-dark(#fff,#1c1c1e);--sc-ink:light-dark(#161619,#f7f7fa);--sc-muted:light-dark(#707077,#a6a6ae);--sc-line:light-dark(#e3e3e9,#35353a);--sc-blue:light-dark(#0067db,#75adff);--sc-soft:light-dark(#e7efff,#192b44);--sc-blue-card:light-dark(#eaf2ff,#14253d);--sc-green-card:light-dark(#eaf5ef,#182d24);--sc-invert:0;color-scheme:light dark;color:var(--sc-ink);background:var(--sc-bg);font:14px/1.4 -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;max-width:420px;width:100%;margin:auto;min-height:758px;border:1px solid var(--sc-line);border-radius:30px;position:relative;overflow:hidden;display:flex;flex-direction:column;box-shadow:0 8px 24px light-dark(#0000000b,#00000030);}
#summary-clarity .sc-phone[data-appearance=light]{color-scheme:light;--sc-invert:0;}
#summary-clarity .sc-phone[data-appearance=dark]{color-scheme:dark;--sc-invert:1;}
@media(prefers-color-scheme:dark){#summary-clarity .sc-phone[data-appearance=auto]{--sc-invert:1;}}
#summary-clarity button,#summary-clarity input,#summary-clarity select{font:inherit;}
#summary-clarity .sc-phone button{color:inherit;}
#summary-clarity button{touch-action:manipulation;}
#summary-clarity .sc-status{display:flex;justify-content:space-between;padding:14px 25px 8px;font-size:12px;font-weight:600;}
#summary-clarity header{display:flex;align-items:center;justify-content:space-between;padding:8px 18px 16px;}
#summary-clarity h2{margin:0;font-size:28px;letter-spacing:-.7px;}
#summary-clarity header>div{display:flex;gap:8px;align-items:center;}
#summary-clarity header button{border:0;background:var(--sc-surface);border-radius:50%;min-width:38px;min-height:38px;display:inline-flex;align-items:center;justify-content:center;}
#summary-clarity header button[data-edit]{border-radius:20px;padding:0 14px;font-size:14px;}
#summary-clarity .sc-providers{display:flex;gap:7px;overflow-x:auto;scrollbar-width:none;padding:0 16px 4px;min-height:42px;}
#summary-clarity .sc-providers button{flex:none;border:0;display:flex;align-items:center;gap:7px;border-radius:12px;padding:9px 12px;background:var(--sc-surface);font-size:12px;}
#summary-clarity .sc-providers button[aria-pressed=true]{background:var(--sc-soft);color:var(--sc-ink);}
#summary-clarity main{padding:0 16px 20px;flex:1;}
#summary-clarity .sc-count{font-size:11px;color:var(--sc-muted);margin:12px 1px 10px;}
#summary-clarity .sc-grid{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:10px;}
#summary-clarity .sc-tile{min-width:0;min-height:112px;display:flex;flex-direction:column;gap:10px;text-align:left;border:0;border-radius:16px;padding:12px 13px;background:var(--sc-surface);}
#summary-clarity .sc-tile[data-color=blue]{background:var(--sc-blue-card);}
#summary-clarity .sc-tile[data-color=green]{background:var(--sc-green-card);}
#summary-clarity .sc-identity{display:flex;align-items:center;gap:7px;min-width:0;font-size:12px;font-weight:500;}
#summary-clarity .sc-name{white-space:nowrap;text-overflow:ellipsis;overflow:hidden;min-width:0;}
#summary-clarity .sc-brand{display:inline-block;flex:none;width:18px;height:18px;object-fit:contain;}
#summary-clarity .sc-brand-mask{background:var(--sc-ink);mask-image:var(--sc-logo);mask-size:contain;mask-repeat:no-repeat;mask-position:center;}
#summary-clarity .sc-brand-codex{filter:grayscale(1) brightness(.7) contrast(20) invert(var(--sc-invert));}
#summary-clarity .sc-reading{display:flex;align-items:baseline;justify-content:space-between;gap:4px;min-width:0;}
#summary-clarity .sc-metric{font-size:12px;color:var(--sc-muted);white-space:nowrap;}
#summary-clarity .sc-value{font-size:27px;font-weight:600;line-height:1.05;letter-spacing:-.6px;font-variant-numeric:tabular-nums;white-space:nowrap;}
#summary-clarity .sc-value small{font-size:16px;font-weight:400;margin-left:2px;}
#summary-clarity .sc-footer{color:var(--sc-muted);font-size:11px;white-space:nowrap;}
#summary-clarity .sc-edit-indicator{margin-left:auto;color:var(--sc-blue);font-size:11px;}
#summary-clarity nav{display:flex;justify-content:space-around;padding:12px 14px 7px;background:var(--sc-surface);}
#summary-clarity nav span{display:flex;align-items:center;gap:4px;flex-direction:column;color:var(--sc-muted);font-size:10px;min-width:54px;}
#summary-clarity nav span[aria-current]{color:var(--sc-blue);}
#summary-clarity nav svg{width:22px;height:22px;}
#summary-clarity .sc-home{width:115px;height:4px;border-radius:4px;background:var(--sc-ink);margin:5px auto 9px;}
#summary-clarity .sc-overlay{position:absolute;inset:0;background:#0007;display:flex;align-items:flex-end;z-index:3;}
#summary-clarity .sc-overlay[hidden]{display:none;}
#summary-clarity .sc-sheet{width:100%;border-radius:24px 24px 0 0;background:var(--sc-bg);padding:10px 18px 23px;max-height:100%;overflow-y:auto;}
#summary-clarity .sc-handle{width:32px;height:4px;border-radius:4px;background:var(--sc-line);margin:0 auto 15px;}
#summary-clarity .sc-sheet-head{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:16px;}
#summary-clarity h3{margin:0;font-size:19px;font-weight:600;}
#summary-clarity .sc-text-button{background:transparent;border:0;padding:8px 3px;color:var(--sc-blue)!important;}
#summary-clarity .sc-full-identity{display:flex;align-items:center;gap:10px;font-size:17px;margin:8px 0 20px;}
#summary-clarity .sc-full-identity small{display:block;font-size:12px;color:var(--sc-muted);margin-top:4px;}
#summary-clarity .sc-detail-reading{font-size:42px;font-weight:600;letter-spacing:-1px;margin-bottom:4px;}
#summary-clarity .sc-detail-label{color:var(--sc-muted);margin-bottom:22px;}
#summary-clarity .sc-detail-row{display:flex;justify-content:space-between;gap:12px;padding:12px 0;border-top:1px solid var(--sc-line);font-size:13px;}
#summary-clarity .sc-detail-row span{color:var(--sc-muted);}
#summary-clarity .sc-primary{display:block;width:100%;padding:13px;border:0;border-radius:13px;background:var(--sc-blue);color:light-dark(#fff,#081b32)!important;margin-top:18px;font-weight:600;}
#summary-clarity .sc-preview-card{max-width:200px;margin:0 auto 18px;}
#summary-clarity .sc-field{display:block;background:var(--sc-surface);padding:11px 13px;border-radius:13px;margin:10px 0;}
#summary-clarity .sc-field>span{display:block;font-size:12px;color:var(--sc-muted);margin-bottom:6px;}
#summary-clarity .sc-field input{border:0;background:transparent;color:var(--sc-ink);width:100%;min-width:0;font-size:16px;line-height:1.5;padding:2px 0;border-radius:0;}
#summary-clarity input::placeholder{color:var(--sc-muted);}
#summary-clarity .sc-help{font-size:11px;color:var(--sc-muted);margin:4px 3px 14px;}
#summary-clarity .sc-segment{display:flex;background:var(--sc-surface);padding:4px;border-radius:11px;margin:12px 0;}
#summary-clarity .sc-segment button{border:0;border-radius:8px;background:transparent;padding:8px 4px;flex:1;font-size:12px;}
#summary-clarity .sc-segment button[aria-pressed=true]{background:var(--sc-bg);box-shadow:0 1px 4px #0001;}
#summary-clarity details{background:var(--sc-surface);padding:12px 13px;border-radius:13px;margin-top:12px;}
#summary-clarity summary{font-size:13px;}
#summary-clarity details .sc-field{padding:8px 0 0;margin-bottom:6px;}
#summary-clarity .sc-swatches{display:flex;gap:10px;align-items:center;margin:12px 0;}
#summary-clarity .sc-swatches>span{font-size:12px;color:var(--sc-muted);margin-right:auto;}
#summary-clarity .sc-swatches button{width:32px;height:32px;border:2px solid transparent;border-radius:50%;background:var(--sc-surface);}
#summary-clarity .sc-swatches button[data-color=blue]{background:var(--sc-blue-card);}
#summary-clarity .sc-swatches button[data-color=green]{background:var(--sc-green-card);}
#summary-clarity .sc-swatches button[aria-pressed=true]{border-color:var(--sc-ink);}
#summary-clarity .sc-field select{width:100%;padding:7px 0;background:var(--sc-surface);color:var(--sc-ink);border:0;}
@media(max-width:360px){#summary-clarity .sc-tile{padding:11px 10px;}#summary-clarity .sc-value{font-size:24px;}#summary-clarity .sc-grid{gap:8px;}}
</style>

function persist(){window.openai?.setWidgetState?.({modelContent:{design:'摘要信息减负',appearance:state.theme,provider:state.provider},privateContent:{theme:state.theme,provider:state.provider,cards:state.cards,aliases:state.aliases}}).catch(()=>{});}
function icon(name){return '<i data-lucide="'+name+'" aria-hidden="true"></i>';}
function brand(provider){if(provider==='Codex')return '<img class="sc-brand sc-brand-codex" src="'+logos.codex+'" alt="" />';return '<span class="sc-brand sc-brand-mask" style="--sc-logo:url('+logos[provider==='Claude'?'claude':'openai']+')" aria-hidden="true"></span>';}
function alias(c,draft=false){const a=accounts[c.account];return (draft?state.draft.alias:state.aliases[c.account])||a.alias;}
function name(c,draft=false){return c.name?.trim()||alias(c,draft);}
function tile(c,draft=false){const a=accounts[c.account];let reading,foot;if(c.depletion){reading='<span class="sc-metric">'+c.date+'</span><strong class="sc-value">'+c.time+'</strong>';foot=c.metric+' · 预计耗尽';}else if(c.mode==='time'){reading='<span class="sc-metric">'+c.metric+'</span><strong class="sc-value">'+(c.countdown||c.reset.replace('小时','h ').replace('分钟','m').replace('分','m').replace('天','d '))+(c.unit?'<small>'+c.unit+'</small>':'')+'</strong>';foot='后重置 · 已用 '+c.value+'%';}else{reading='<span class="sc-metric">'+c.metric+'</span><strong class="sc-value">'+c.value+'<small>%</small></strong>';foot=c.reset+'后重置';}return '<button type="button" class="sc-tile cursor-interaction" data-card="'+c.id+'" data-color="'+(c.color||'white')+'" '+(draft?'disabled':'')+' aria-label="'+esc(a.provider+' '+name(c,draft)+' '+c.metric+' '+(c.depletion?c.date+' '+c.time+'预计耗尽':c.value+'%已用，'+c.reset+'后重置'))+'"><span class="sc-identity">'+brand(a.provider)+'<span class="sc-name" data-tooltip="'+esc(name(c,draft))+'">'+esc(name(c,draft))+'</span>'+(state.edit&&!draft?'<span class="sc-edit-indicator">编辑</span>':'')+'</span><span class="sc-reading">'+reading+'</span><span class="sc-footer">'+foot+'</span></button>';}
function initIcons(){globalThis.lucide?.createIcons({attrs:{width:18,height:18}});}
function renderGrid(){root.querySelector('.sc-grid').innerHTML=state.cards.filter(c=>state.provider==='all'||accounts[c.account].provider===state.provider).map(c=>tile(c)).join('');const n=state.cards.filter(c=>state.provider==='all'||accounts[c.account].provider===state.provider).length;root.querySelector('.sc-count').textContent=n+' 个指标 · 演示数据';root.querySelector('[data-edit]').textContent=state.edit?'完成':'编辑';}
function renderProviders(){root.querySelector('.sc-providers').innerHTML=['all','Claude','Codex','ChatGPT'].map(p=>'<button type="button" class="cursor-interaction" data-provider="'+p+'" aria-pressed="'+(state.provider===p)+'">'+(p==='all'?'所有服务商':brand(p)+p)+'</button>').join('');}
function renderTheme(){phone.dataset.appearance=state.theme;root.querySelectorAll('[data-theme]').forEach(b=>b.setAttribute('aria-pressed',b.dataset.theme===state.theme));}
function shell(title,content){root.querySelector('.sc-overlay').hidden=false;root.querySelector('.sc-sheet').innerHTML='<div class="sc-handle"></div><div class="sc-sheet-head"><h3>'+title+'</h3><button type="button" class="sc-text-button cursor-interaction" data-close aria-label="关闭">'+(title==='自定义卡片'?'取消':'完成')+'</button></div>'+content;initIcons();}
function close(){root.querySelector('.sc-overlay').hidden=true;state.sheet=null;state.draft=null;}
function detail(id){const c=state.cards.find(c=>c.id===id),a=accounts[c.account];state.sheet={kind:'detail',id};shell('指标详情','<div class="sc-full-identity">'+brand(a.provider)+'<div>'+esc(a.provider+' · '+alias(c))+'<small>'+esc(a.full)+'</small></div></div><div class="sc-detail-reading">'+(c.depletion?c.time:c.value+'%')+'</div><div class="sc-detail-label">'+c.metric+' · '+(c.depletion?c.date+' 预计耗尽':'已用')+'</div><div class="sc-detail-row"><span>账号别名</span>'+esc(alias(c))+'</div><div class="sc-detail-row"><span>套餐</span>'+esc(a.plan)+'</div>'+(!c.depletion?'<div class="sc-detail-row"><span>距离重置</span>'+c.reset+'</div>':'')+'<button type="button" class="sc-primary cursor-interaction" data-customize="'+id+'">自定义卡片</button>');}
function preview(){root.querySelector('.sc-preview-card').innerHTML=tile(state.draft.card,true);}
function editor(id,newCard){const c=newCard||state.cards.find(c=>c.id===id);state.sheet={kind:'editor',id,isNew:!!newCard};state.draft={card:{...c},alias:state.aliases[c.account]||accounts[c.account].alias};shell('自定义卡片','<div class="sc-preview-card"></div><label class="sc-field"><span>卡片显示名称</span><input type="text" data-name autocomplete="off" autocapitalize="off" spellcheck="false" maxlength="40" value="'+esc(c.name||'')+'" placeholder="'+esc(alias(c))+'" /></label><p class="sc-help">只改这一张，例如 C 5×；留空则使用账号别名。</p>'+(!c.depletion?'<div class="sc-segment" aria-label="重点展示"><button type="button" data-mode="percent" aria-pressed="'+(c.mode!=='time')+'">用量百分比</button><button type="button" data-mode="time" aria-pressed="'+(c.mode==='time')+'">重置倒计时</button></div>':'')+'<div class="sc-swatches"><span>卡片颜色</span>'+['white','blue','green'].map(x=>'<button type="button" class="cursor-interaction" data-color="'+x+'" aria-label="'+({white:'默认',blue:'蓝色',green:'绿色'}[x])+'" aria-pressed="'+((c.color||'white')===x)+'"></button>').join('')+'</div><details><summary>账号别名 · 同账号卡片共用</summary><label class="sc-field"><span>'+esc(accounts[c.account].full)+'</span><input type="text" data-alias autocomplete="off" maxlength="24" value="'+esc(state.draft.alias)+'" /></label><p class="sc-help">例如 Personal 或 Work。自定义过名称的卡片保持自己的名称。</p></details><button type="button" class="sc-primary cursor-interaction" data-save>'+(newCard?'添加卡片':'保存')+'</button>');preview();}
function add(){state.sheet={kind:'add'};shell('添加指标','<label class="sc-field"><span>服务商</span><select data-add-provider><option>Claude</option><option>Codex</option><option>ChatGPT</option></select></label><label class="sc-field"><span>指标</span><select data-add-metric><option value="Session">Session</option><option value="Weekly">Weekly</option><option value="depletion">Weekly · 预计耗尽</option></select></label><label class="sc-field"><span>账号</span><select data-add-account></select></label><button type="button" class="sc-primary cursor-interaction" data-add-next>下一步 · 自定义</button>');addAccounts();}
function addAccounts(){const provider=root.querySelector('[data-add-provider]').value;root.querySelector('[data-add-account]').innerHTML=Object.entries(accounts).filter(([,a])=>a.provider===provider).map(([id,a])=>'<option value="'+id+'">'+esc((state.aliases[id]||a.alias)+' · '+a.plan)+'</option>').join('');}
root.addEventListener('click',e=>{const b=e.target.closest('button');if(!b)return;if(b.dataset.theme){state.theme=b.dataset.theme;renderTheme();persist();}else if(b.dataset.provider){state.provider=b.dataset.provider;renderProviders();renderGrid();persist();}else if(b.hasAttribute('data-close'))close();else if(b.hasAttribute('data-edit')){state.edit=!state.edit;renderGrid();}else if(b.hasAttribute('data-add'))add();else if(b.dataset.customize)editor(b.dataset.customize);else if(b.dataset.card){if(state.edit)editor(b.dataset.card);else detail(b.dataset.card);}else if(b.dataset.mode){state.draft.card.mode=b.dataset.mode;root.querySelectorAll('[data-mode]').forEach(x=>x.setAttribute('aria-pressed',x===b));preview();}else if(b.dataset.color){state.draft.card.color=b.dataset.color;root.querySelectorAll('.sc-swatches button').forEach(x=>x.setAttribute('aria-pressed',x===b));preview();}else if(b.hasAttribute('data-save')){const d=state.draft;state.aliases[d.card.account]=d.alias.trim();if(state.sheet.isNew)state.cards.push(d.card);else state.cards[state.cards.findIndex(c=>c.id===d.card.id)]=d.card;renderGrid();close();persist();}else if(b.hasAttribute('data-add-next')){const account=root.querySelector('[data-add-account]').value,m=root.querySelector('[data-add-metric]').value;const c={id:'new-'+Date.now(),account,metric:m==='depletion'?'Weekly':m,value:16,reset:'3天23小时',depletion:m==='depletion',date:'10/23',time:'21:06'};editor(c.id,c);}initIcons();});
root.addEventListener('input',e=>{if(e.target.hasAttribute('data-name')){state.draft.card.name=e.target.value;preview();}else if(e.target.hasAttribute('data-alias')){state.draft.alias=e.target.value;root.querySelector('[data-name]').placeholder=e.target.value||accounts[state.draft.card.account].alias;preview();}});
root.addEventListener('change',e=>{if(e.target.hasAttribute('data-add-provider'))addAccounts();});
root.querySelector('.sc-overlay').addEventListener('click',e=>{if(e.target===e.currentTarget)close();});root.addEventListener('keydown',e=>{if(e.key==='Escape')close();});
renderTheme();renderProviders();renderGrid();initIcons();
})();
</script>

name: Release Mac

# Builds, signs (Developer ID), notarizes and publishes the macOS app from
# GitHub Actions. Replaces running Scripts/release.sh from a laptop.
# release-mac-verify.yml re-checks the published zip afterwards.
#
# Secrets (repository secrets):
#   MACOS_DEVELOPER_ID_P12_BASE64 / MACOS_DEVELOPER_ID_P12_PASSWORD
#   MACOS_PROVISIONING_PROFILE_BASE64
#   APP_STORE_CONNECT_KEY_ID / APP_STORE_CONNECT_ISSUER_ID / APP_STORE_CONNECT_API_KEY_P8
#   SPARKLE_PRIVATE_KEY
#
# Does not generate or commit an appcast. The Homebrew tap is updated by
# release-mac-verify.yml after the published zip passes its launch check.

on:
  workflow_dispatch:
    inputs:
      draft:
        description: "Create the GitHub release as a draft"
        type: boolean
        default: true
      prerelease:
        description: "Mark the GitHub release as a prerelease"
        type: boolean
        default: false

permissions:
  contents: write
  actions: write # dispatch release-mac-verify.yml after a direct (non-draft) publish

concurrency:
  group: release-mac
  cancel-in-progress: false

jobs:
  release:
    if: github.repository == 'audichuang/CodexBar-Mobile' && github.ref == 'refs/heads/mobile-dev'
    runs-on: macos-26
    timeout-minutes: 150
    env:
      GH_TOKEN: ${{ github.token }}
      # This fork ships Apple Silicon only (the cask has depends_on arch: :arm64),
      # so skip the x86_64 slice. sign-and-notarize.sh and package_app.sh derive
      # the SwiftPM build, lipo, dSYM merge and widget ARCHS from this.
      ARCHES: arm64
      # Keep the widget Xcode DerivedData inside the workspace so actions/cache can
      # persist it (default is under $TMPDIR, which is not cached).
      CODEXBAR_WIDGET_DERIVED_DATA_ROOT: ${{ github.workspace }}/.widget-derived
      # package_app.sh caps the widget-extension xcodebuild at 900 s;
      # hosted runners have needed longer (audi.2 first attempt was cut off there).
      CODEXBAR_WIDGET_EXTENSION_TIMEOUT_SECONDS: "2400"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Select newest Xcode 26.x
        run: |
          set -euo pipefail
          candidate="$(printf '%s\n' /Applications/Xcode_26.*.app | sort -V | tail -n 1)"
          if [[ ! -d "$candidate" ]]; then
            echo "::error::No /Applications/Xcode_26.*.app found on this runner"
            exit 1
          fi
          sudo xcode-select -s "${candidate}/Contents/Developer"
          echo "DEVELOPER_DIR=${candidate}/Contents/Developer" >> "$GITHUB_ENV"
          export DEVELOPER_DIR="${candidate}/Contents/Developer"
          [[ "$(/usr/bin/xcodebuild -version)" == Xcode\ 26.* ]]
          /usr/bin/xcodebuild -version

      - name: Compute build cache keys
        id: cachekeys
        run: |
          set -euo pipefail
          # Xcode version + build number (selects the Swift toolchain and SDK).
          xcode="$(/usr/bin/xcodebuild -version | tr '\n' '-' | tr -c 'A-Za-z0-9.\n-' '_')"
          echo "xcode=${xcode}" >> "$GITHUB_OUTPUT"

      # Caches are an optimization only: SwiftPM and Xcode recompile anything whose
      # sources changed, and package_app.sh re-validates arch, minos and SDK of every
      # staged binary. Restore-only here; saved after a successful build below.
      - name: Restore SwiftPM build cache
        id: swiftpm-cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            .build
            !.build/package-products
            !.build/entitlements
            ~/Library/Caches/org.swift.swiftpm
          key: release-swiftpm-${{ runner.os }}-${{ runner.arch }}-${{ steps.cachekeys.outputs.xcode }}-${{ hashFiles('Package.resolved', 'Package.swift') }}-${{ github.sha }}
          restore-keys: |
            release-swiftpm-${{ runner.os }}-${{ runner.arch }}-${{ steps.cachekeys.outputs.xcode }}-${{ hashFiles('Package.resolved', 'Package.swift') }}-
            release-swiftpm-${{ runner.os }}-${{ runner.arch }}-${{ steps.cachekeys.outputs.xcode }}-

      - name: Restore widget DerivedData cache
        id: widget-cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            .widget-derived
            !.widget-derived/**/Results
            !.widget-derived/**/xcodebuild.log
          key: release-widget-${{ runner.os }}-${{ runner.arch }}-${{ steps.cachekeys.outputs.xcode }}-${{ hashFiles('Package.resolved', 'Package.swift', 'WidgetExtension/project.yml', 'WidgetExtension/CodexBarWidgetExtension.xcodeproj/project.pbxproj') }}-${{ github.sha }}
          restore-keys: |
            release-widget-${{ runner.os }}-${{ runner.arch }}-${{ steps.cachekeys.outputs.xcode }}-${{ hashFiles('Package.resolved', 'Package.swift', 'WidgetExtension/project.yml', 'WidgetExtension/CodexBarWidgetExtension.xcodeproj/project.pbxproj') }}-
            release-widget-${{ runner.os }}-${{ runner.arch }}-${{ steps.cachekeys.outputs.xcode }}-

      - name: Compute version, tag and asset names
        run: |
          set -euo pipefail
          set -a; source version.env; source version.fork.env; set +a
          if [[ -z "${MARKETING_VERSION:-}" || -z "${MOBILE_VERSION:-}" ]]; then
            echo "::error::version.env must define MARKETING_VERSION and MOBILE_VERSION"
            exit 1
          fi
          if [[ -z "${FORK_PATCH:-}" ]]; then
            echo "::error::version.fork.env must define FORK_PATCH for fork releases"
            exit 1
          fi
          SUFFIX="mobile.${MOBILE_VERSION}${FORK_PATCH:+-audi.${FORK_PATCH}}"
          TAG="v${MARKETING_VERSION}-${SUFFIX}"
          BASENAME="CodexBar-${MARKETING_VERSION}-${SUFFIX}"
          {
            echo "MARKETING_VERSION=${MARKETING_VERSION}"
            echo "MOBILE_VERSION=${MOBILE_VERSION}"
            echo "FORK_PATCH=${FORK_PATCH:-}"
            echo "UPSTREAM_VERSION=${UPSTREAM_VERSION:-unknown}"
            echo "TAG=${TAG}"
            echo "ZIP=${BASENAME}.zip"
            echo "DSYM_ZIP=${BASENAME}.dSYM.zip"
          } >> "$GITHUB_ENV"
          echo "Tag: ${TAG}; asset: ${BASENAME}.zip"
          if git ls-remote --exit-code --tags origin "refs/tags/${TAG}" >/dev/null 2>&1; then
            echo "::error::Tag ${TAG} already exists; bump FORK_PATCH in version.fork.env"
            exit 1
          fi
          if gh release view "${TAG}" --repo "${GITHUB_REPOSITORY}" >/dev/null 2>&1; then
            echo "::error::Release ${TAG} already exists; bump FORK_PATCH in version.fork.env"
            exit 1
          fi

      - name: Import Developer ID certificate into temporary keychain
        env:
          P12_BASE64: ${{ secrets.MACOS_DEVELOPER_ID_P12_BASE64 }}
          P12_PASSWORD: ${{ secrets.MACOS_DEVELOPER_ID_P12_PASSWORD }}
        run: |
          set -euo pipefail
          KEYCHAIN_PATH="${RUNNER_TEMP}/codexbar-release.keychain-db"
          KEYCHAIN_PASSWORD="$(openssl rand -base64 32)"
          echo "::add-mask::${KEYCHAIN_PASSWORD}"
          P12_PATH="${RUNNER_TEMP}/developer-id.p12"
          {
            echo "KEYCHAIN_PATH=${KEYCHAIN_PATH}"
            echo "P12_PATH=${P12_PATH}"
          } >> "$GITHUB_ENV"
          ( umask 077; printf '%s' "$P12_BASE64" | base64 --decode > "$P12_PATH" )
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security set-keychain-settings "$KEYCHAIN_PATH"   # no auto-lock, no timeout
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security import "$P12_PATH" -k "$KEYCHAIN_PATH" -P "$P12_PASSWORD" \
            -T /usr/bin/codesign -T /usr/bin/security
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s \
            -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH" >/dev/null
          # Add to the user search list, keeping existing keychains.
          existing="$(security list-keychains -d user | tr -d '"' | xargs)"
          # shellcheck disable=SC2086
          security list-keychains -d user -s "$KEYCHAIN_PATH" $existing
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          identities="$(security find-identity -v -p codesigning)"
          printf '%s\n' "$identities" | awk '{ $1=""; $2=""; print "  identity:" $0 }'
          if ! grep -Fq 'Developer ID Application: Yung Chun Chuang (37HFR5V2JJ)' <<<"$identities"; then
            echo "::error::Developer ID Application: Yung Chun Chuang (37HFR5V2JJ) not found in imported keychain"
            exit 1
          fi
          rm -f "$P12_PATH"

      - name: Install and validate provisioning profile
        env:
          PROFILE_BASE64: ${{ secrets.MACOS_PROVISIONING_PROFILE_BASE64 }}
        run: |
          set -euo pipefail
          mkdir -p Provisioning
          ( umask 077; printf '%s' "$PROFILE_BASE64" | base64 --decode > Provisioning/CodexBar_Dev.provisionprofile )
          python3 Scripts/validate_cloudkit_profile.py \
            Provisioning/CodexBar_Dev.provisionprofile 37HFR5V2JJ.com.audichuang.codexbar

      - name: Write Sparkle key file
        env:
          SPARKLE_PRIVATE_KEY: ${{ secrets.SPARKLE_PRIVATE_KEY }}
        run: |
          set -euo pipefail
          KEY_FILE="${RUNNER_TEMP}/sparkle_ed25519.key"
          ( umask 077; printf '%s\n' "$SPARKLE_PRIVATE_KEY" > "$KEY_FILE" )
          echo "SPARKLE_PRIVATE_KEY_FILE=${KEY_FILE}" >> "$GITHUB_ENV"

      - name: Build, sign, notarize and package
        id: build
        env:
          APP_STORE_CONNECT_KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
          APP_STORE_CONNECT_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
          APP_STORE_CONNECT_API_KEY_P8: ${{ secrets.APP_STORE_CONNECT_API_KEY_P8 }}
        run: |
          set -euo pipefail
          # sign-and-notarize.sh launches the stapled app and requires it to
          # stay alive; that needs a GUI (Aqua) session. This is the only launch
          # gate: release-mac-verify.yml is not triggered by releases created
          # with github.token, so never relax it.
          manager="$(launchctl managername 2>/dev/null || true)"
          echo "launchctl managername: ${manager:-unknown}"
          if [[ "$manager" != "Aqua" ]]; then
            echo "::error::No Aqua session on this runner; refusing to release without the launch check"
            exit 1
          fi
          ./Scripts/sign-and-notarize.sh
          ls -la "$ZIP" "$DSYM_ZIP"

      - name: Save SwiftPM build cache
        if: steps.build.outcome == 'success'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            .build
            !.build/package-products
            !.build/entitlements
            ~/Library/Caches/org.swift.swiftpm
          key: release-swiftpm-${{ runner.os }}-${{ runner.arch }}-${{ steps.cachekeys.outputs.xcode }}-${{ hashFiles('Package.resolved', 'Package.swift') }}-${{ github.sha }}

      - name: Save widget DerivedData cache
        if: steps.build.outcome == 'success'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            .widget-derived
            !.widget-derived/**/Results
            !.widget-derived/**/xcodebuild.log
          key: release-widget-${{ runner.os }}-${{ runner.arch }}-${{ steps.cachekeys.outputs.xcode }}-${{ hashFiles('Package.resolved', 'Package.swift', 'WidgetExtension/project.yml', 'WidgetExtension/CodexBarWidgetExtension.xcodeproj/project.pbxproj') }}-${{ github.sha }}

      - name: Verify release zip
        run: |
          set -euo pipefail
          VERIFY_DIR="$(mktemp -d "${RUNNER_TEMP}/verify.XXXXXX")"
          ditto -x -k "$ZIP" "$VERIFY_DIR"
          APP="${VERIFY_DIR}/CodexBar.app"
          ENT="${VERIFY_DIR}/entitlements.plist"
          codesign --verify --deep --strict --verbose=2 "$APP"
          codesign -d --entitlements - --xml "$APP" > "$ENT" 2>/dev/null
          aps="$(/usr/libexec/PlistBuddy -c 'Print :com.apple.developer.aps-environment' "$ENT")"
          appid="$(/usr/libexec/PlistBuddy -c 'Print :com.apple.application-identifier' "$ENT")"
          echo "aps-environment=${aps}"
          echo "application-identifier=${appid}"
          [[ "$aps" == "production" ]] || { echo "::error::aps-environment is '${aps}', expected production"; exit 1; }
          [[ "$appid" == "37HFR5V2JJ.com.audichuang.codexbar" ]] || { echo "::error::unexpected application-identifier '${appid}'"; exit 1; }
          [[ -f "$APP/Contents/embedded.provisionprofile" ]] || { echo "::error::embedded.provisionprofile missing"; exit 1; }
          shortver="$(/usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' "$APP/Contents/Info.plist")"
          echo "CFBundleShortVersionString=${shortver}"
          [[ "$shortver" == "$MARKETING_VERSION" ]] || { echo "::error::CFBundleShortVersionString '${shortver}' != MARKETING_VERSION '${MARKETING_VERSION}'"; exit 1; }
          spctl -a -t exec -vv "$APP"
          xcrun stapler validate "$APP"
          rm -rf "$VERIFY_DIR"

      - name: Upload workflow artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ${{ env.ZIP }}
          path: |
            ${{ env.ZIP }}
            ${{ env.DSYM_ZIP }}
          if-no-files-found: error
          retention-days: 14

      - name: Create GitHub release
        env:
          DRAFT: ${{ inputs.draft }}
          PRERELEASE: ${{ inputs.prerelease }}
        run: |
          set -euo pipefail
          ZIP_SHA="$(shasum -a 256 "$ZIP" | awk '{print $1}')"
          DSYM_SHA="$(shasum -a 256 "$DSYM_ZIP" | awk '{print $1}')"
          NOTES_FILE="${RUNNER_TEMP}/release-notes.md"
          cat > "$NOTES_FILE" <<NOTES
          CodexBar ${MARKETING_VERSION} (mobile ${MOBILE_VERSION}, audi.${FORK_PATCH})

          - Upstream base: ${UPSTREAM_VERSION}
          - Source commit: ${GITHUB_SHA}
          - Built, signed and notarized by GitHub Actions run ${GITHUB_RUN_ID}

          SHA-256:
          - ${ZIP}: ${ZIP_SHA}
          - ${DSYM_ZIP}: ${DSYM_SHA}
          NOTES
          flags=()
          [[ "$DRAFT" == "true" ]] && flags+=(--draft)
          [[ "$PRERELEASE" == "true" ]] && flags+=(--prerelease)
          gh release create "$TAG" "$ZIP" "$DSYM_ZIP" \
            --repo "$GITHUB_REPOSITORY" \
            --target "$GITHUB_SHA" \
            --title "CodexBar ${MARKETING_VERSION} (mobile ${MOBILE_VERSION}, audi.${FORK_PATCH})" \
            --notes-file "$NOTES_FILE" \
            ${flags[@]+"${flags[@]}"}

      - name: Dispatch release verification
        # Releases created with github.token fire no `release: published`
        # event, so a direct publish would never reach release-mac-verify.yml
        # (clean-runner launch check, then the Homebrew tap). Drafts are
        # verified when they are published by hand.
        if: ${{ !inputs.draft }}
        run: gh workflow run release-mac-verify.yml --repo "$GITHUB_REPOSITORY" --ref mobile-dev -f tag="$TAG"

      - name: Cleanup secrets and keychain
        if: always()
        run: |
          set -u
          if [[ -n "${KEYCHAIN_PATH:-}" ]]; then
            security delete-keychain "$KEYCHAIN_PATH" 2>/dev/null || true
          fi
          rm -f "${P12_PATH:-}" "${SPARKLE_PRIVATE_KEY_FILE:-}" \
            Provisioning/CodexBar_Dev.provisionprofile 2>/dev/null || true

name: Mac Release Verify

# Verifies a published Mac release zip is actually launchable.
#
# Background: spctl / notarization / stapler can all pass on a bundle
# that AMFI later rejects at launch time (POSIX 163, "Launchd job spawn
# failed"). The most common cause is a missing
# Contents/embedded.provisionprofile (entitlements with
# com.apple.application-identifier require it). The local
# Scripts/sign-and-notarize.sh has a launch-test gate that catches this
# pre-publish, but in case anything ever bypasses that script (manual
# release, hotfix, future tooling change) this workflow is the second
# line of defense, running on a clean macOS runner.
#
# No secrets required — only github.token (built-in).

on:
  push:
    tags:
      - 'v*-mobile.*'
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag to verify (e.g. v0.23.4-mobile.1.5.1)'
        required: true

permissions:
  contents: read

jobs:
  verify:
    runs-on: macos-14
    timeout-minutes: 15
    outputs:
      tag: ${{ steps.tag.outputs.tag }}
      zip: ${{ steps.ver.outputs.zip }}
      skip: ${{ steps.gate.outputs.skip }}
      zip_sha: ${{ steps.download.outputs.sha }}
    steps:
      - name: Resolve tag from event
        id: tag
        run: |
          set -euo pipefail
          if [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            echo "tag=${{ inputs.tag }}" >> "$GITHUB_OUTPUT"
          elif [[ "${{ github.event_name }}" == "release" ]]; then
            echo "tag=${{ github.event.release.tag_name }}" >> "$GITHUB_OUTPUT"
          else
            echo "tag=${{ github.ref_name }}" >> "$GITHUB_OUTPUT"
          fi

      - name: Parse tag into version components
        id: ver
        run: |
          set -euo pipefail
          # Tag shape: v<MARKETING>-mobile.<MOBILE>
          TAG="${{ steps.tag.outputs.tag }}"
          REST="${TAG#v}"
          MARKETING="${REST%-mobile.*}"
          MOBILE="${REST#*-mobile.}"
          ZIP="CodexBar-${MARKETING}-mobile.${MOBILE}.zip"
          echo "marketing=$MARKETING" >> "$GITHUB_OUTPUT"
          echo "mobile=$MOBILE" >> "$GITHUB_OUTPUT"
          echo "zip=$ZIP" >> "$GITHUB_OUTPUT"
          echo "Will verify: $ZIP"

      - name: Skip if release not yet published (push-tag race)
        # release.sh Phase 1 pushes the tag BEFORE Phase 2 publishes the
        # GitHub release. The push-tag trigger fires immediately, but
        # `gh release download` would 404 because the release is still a
        # draft. The release-published trigger will rerun this workflow
        # once Phase 2 lands, so just skip cleanly here. Manual tag
        # pushes or hotfix flows that publish the release at tag-push
        # time still work — the release exists in those cases.
        id: gate
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          TAG="${{ steps.tag.outputs.tag }}"
          if gh release view "$TAG" --repo "${{ github.repository }}" \
               --json isDraft -q .isDraft 2>/dev/null | grep -q "true"; then
            echo "Release $TAG is still a draft — skipping verify."
            echo "skip=true" >> "$GITHUB_OUTPUT"
          elif ! gh release view "$TAG" --repo "${{ github.repository }}" \
                  >/dev/null 2>&1; then
            echo "Release $TAG does not exist yet — skipping verify."
            echo "Will run again on the release:published trigger."
            echo "skip=true" >> "$GITHUB_OUTPUT"
          else
            echo "Release $TAG is published — proceeding with verification."
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Download release zip from GitHub
        if: steps.gate.outputs.skip != 'true'
        id: download
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p /tmp/release-verify
          gh release download "${{ steps.tag.outputs.tag }}" \
            --repo "${{ github.repository }}" \
            --pattern "${{ steps.ver.outputs.zip }}" \
            --dir /tmp/release-verify
          ls -la /tmp/release-verify/
          # The tap job publishes exactly these bytes, not whatever the asset is later.
          echo "sha=$(shasum -a 256 "/tmp/release-verify/${{ steps.ver.outputs.zip }}" | awk '{print $1}')" >> "$GITHUB_OUTPUT"

      - name: Extract bundle
        if: steps.gate.outputs.skip != 'true'
        run: |
          set -euo pipefail
          mkdir -p /tmp/release-verify/unzipped
          ditto -x -k "/tmp/release-verify/${{ steps.ver.outputs.zip }}" /tmp/release-verify/unzipped
          ls -la /tmp/release-verify/unzipped/CodexBar.app/Contents/

      - name: Verify embedded.provisionprofile is present
        if: steps.gate.outputs.skip != 'true'
        run: |
          set -euo pipefail
          PROFILE=/tmp/release-verify/unzipped/CodexBar.app/Contents/embedded.provisionprofile
          if [[ ! -f "$PROFILE" ]]; then
            echo "::error::Contents/embedded.provisionprofile MISSING from release zip."
            echo "::error::AMFI will reject the binary at launch (POSIX 163)."
            echo "::error::Root cause is usually package_app.sh failing to embed the profile."
            exit 1
          fi
          SIZE=$(wc -c < "$PROFILE")
          echo "embedded.provisionprofile present, $SIZE bytes"

      - name: spctl assess (Gatekeeper)
        if: steps.gate.outputs.skip != 'true'
        run: spctl -a -t exec -vv /tmp/release-verify/unzipped/CodexBar.app

      - name: Stapler validate
        if: steps.gate.outputs.skip != 'true'
        run: xcrun stapler validate /tmp/release-verify/unzipped/CodexBar.app

      - name: Launch test (must stay alive 5s)
        if: steps.gate.outputs.skip != 'true'
        run: |
          set -euo pipefail
          APP=/tmp/release-verify/unzipped/CodexBar.app
          "$APP/Contents/MacOS/CodexBar" >/dev/null 2>&1 &
          PID=$!
          sleep 5
          if kill -0 "$PID" 2>/dev/null; then
            kill -TERM "$PID" 2>/dev/null || true
            sleep 1
            if kill -0 "$PID" 2>/dev/null; then
              kill -KILL "$PID" 2>/dev/null || true
            fi
            wait "$PID" 2>/dev/null || true
            echo "Launch test PASSED — process stayed alive 5s"
          else
            wait "$PID" 2>/dev/null || true
            echo "::error::Launch test FAILED — process exited within 5s of launch"
            echo "::error::AMFI / Launch Services rejected the binary at runtime."
            echo "::error::This release zip will fail to launch on user machines."
            echo "::error::Mitigation: draft the release on GitHub immediately."
            exit 1
          fi

  # Publishes the verified zip to audichuang/homebrew-tap as
  # `audichuang/tap/codexbar-mobile`. Runs only after `verify` passed on the
  # published release, so the tap never points at a zip that failed to launch.
  # Writes over SSH with the repo-scoped deploy key HOMEBREW_TAP_DEPLOY_KEY
  # (write access to the tap only); github.token cannot push to another repo.
  homebrew-tap:
    needs: verify
    if: >-
      github.repository == 'audichuang/CodexBar-Mobile' &&
      needs.verify.outputs.skip == 'false'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    concurrency:
      group: homebrew-tap-codexbar-mobile
      cancel-in-progress: false
    env:
      GH_TOKEN: ${{ github.token }}
      TAG: ${{ needs.verify.outputs.tag }}
      ZIP: ${{ needs.verify.outputs.zip }}
      VERIFIED_SHA: ${{ needs.verify.outputs.zip_sha }}
    steps:
      - name: Resolve release metadata
        id: meta
        run: |
          set -euo pipefail
          json="$(gh api "repos/${{ github.repository }}/releases/tags/${TAG}")"
          # Fresh metadata: the release may have been redrafted or marked
          # prerelease while verify ran or this job waited for the concurrency slot.
          if [[ "$(jq -r '.draft or .prerelease' <<<"$json")" != "false" ]]; then
            echo "Release $TAG is a draft or prerelease; the tap keeps the last stable version."
            echo "skip=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          # Checksum from GitHub's server-side digest of the uploaded bytes;
          # a missing or empty-file digest fails instead of shipping to the tap.
          sha="$(jq -r --arg n "$ZIP" '.assets[] | select(.name == $n) | (.digest // "") | sub("^sha256:"; "")' <<<"$json")"
          if ! [[ "$sha" =~ ^[0-9a-f]{64}$ ]] || [[ "$sha" == e3b0c44298fc1c149afbf4c8996fb92427ae41e4649b934ca495991b7852b855 ]]; then
            echo "::error::no usable sha256 for $ZIP (got '${sha}')"
            exit 1
          fi
          if [[ "$sha" != "$VERIFIED_SHA" ]]; then
            echo "::error::asset $ZIP changed after verification (verified ${VERIFIED_SHA}, now ${sha})"
            exit 1
          fi
          version="${TAG#v}"
          [[ "CodexBar-${version}.zip" == "$ZIP" ]] || { echo "::error::zip $ZIP does not match tag $TAG"; exit 1; }
          {
            echo "version=$version"
            echo "sha=$sha"
            echo "skip=false"
          } >> "$GITHUB_OUTPUT"

      - name: Checkout Homebrew tap
        if: steps.meta.outputs.skip == 'false'
        uses: actions/checkout@v6
        with:
          repository: audichuang/homebrew-tap
          ssh-key: ${{ secrets.HOMEBREW_TAP_DEPLOY_KEY }}
          path: tap

      - name: Write cask and README row
        if: steps.meta.outputs.skip == 'false'
        env:
          VERSION: ${{ steps.meta.outputs.version }}
          SHA: ${{ steps.meta.outputs.sha }}
        run: |
          set -euo pipefail
          mkdir -p tap/Casks
          cat > tap/Casks/codexbar-mobile.rb <<EOF
          cask "codexbar-mobile" do
            version "${VERSION}"
            sha256 "${SHA}"

            url "https://github.com/audichuang/CodexBar-Mobile/releases/download/v#{version}/CodexBar-#{version}.zip"
            name "CodexBar Mobile Mac Companion"
            desc "AI provider usage monitor with iCloud sync to the iOS companion"
            homepage "https://github.com/audichuang/CodexBar-Mobile"

            livecheck do
              url :url
              regex(/^v?(\d+(?:\.\d+)+-mobile\.\d+(?:\.\d+)+-audi\.\d+)\$/i)
              strategy :github_releases
            end

            # The machines update this app with mac-codexbar-update.sh, which
            # restarts it through the managed LaunchAgent; auto_updates keeps a
            # generic \`brew upgrade\` from swapping it underneath that agent.
            auto_updates true
            conflicts_with cask: "codexbar"
            depends_on arch: :arm64
            depends_on macos: :sonoma

            app "CodexBar.app"
            binary "#{appdir}/CodexBar.app/Contents/Helpers/CodexBarCLI", target: "codexbar"
          end
          EOF
          # The heredoc above is indented for YAML; strip the common indent.
          sed -i 's/^          //' tap/Casks/codexbar-mobile.rb
          # shellcheck disable=SC2016 # backticks are Markdown, not command substitution
          row='| **codexbar-mobile** | `brew install --cask audichuang/tap/codexbar-mobile` | CodexBar Mac companion with iCloud sync to the iPhone app, from [audichuang/CodexBar-Mobile](https://github.com/audichuang/CodexBar-Mobile). Apple Silicon only. Notarized. |'
          if ! grep -q '^| \*\*codexbar-mobile\*\*' tap/README.md; then
            awk -v row="$row" '{print} /^\| \*\*orca-fork\*\*/ && !done {print row; done=1}' tap/README.md > tap/README.md.new
            grep -q '^| \*\*codexbar-mobile\*\*' tap/README.md.new || { echo "::error::could not place README row"; exit 1; }
            mv tap/README.md.new tap/README.md
          fi
          ruby -c tap/Casks/codexbar-mobile.rb
          cat tap/Casks/codexbar-mobile.rb

      - name: Commit and push
        if: steps.meta.outputs.skip == 'false'
        working-directory: tap
        env:
          VERSION: ${{ steps.meta.outputs.version }}
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Casks/codexbar-mobile.rb README.md
          if git diff --cached --quiet; then
            echo "Tap already at ${VERSION}."
            exit 0
          fi
          git commit -m "codexbar-mobile ${VERSION}"
          for _ in 1 2 3; do
            git push origin HEAD:main && exit 0
            git pull --rebase origin main
          done
          echo "::error::could not push to the tap"
          exit 1
